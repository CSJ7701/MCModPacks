name: Build, Release & Deploy Site

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1

      - name: Build Pack Archives
        run: |
          mkdir -p build_output
          for pack_dir in packs/*; do
            if [ -d "$pack_dir" ]; then
              PACK_ID=$(basename "$pack_dir")
              (
                cd "$pack_dir" || exit 1
                packwiz modrinth export -o "../../build_output/${PACK_ID}.mrpack"
                packwiz curseforge export -o "../../build_output/${PACK_ID}-curseforge.zip"
              )
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*
          generate_release_notes: true

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Site & Manifest
        run: |
          mkdir -p dist/packs
          if [ -d "site" ]; then cp -r site/* dist/; fi

          MANIFEST="["

          for pack_dir in packs/*; do
            if [ -d "$pack_dir" ]; then
              PACK_ID=$(basename "$pack_dir")
              mkdir -p "dist/packs/$PACK_ID"

              # 1. Generate Mod List via standalone Python script
              MODLIST_FILE="dist/packs/$PACK_ID/modlist.txt"
              echo "# Mod List for $PACK_ID" > "$MODLIST_FILE"
              echo "" >> "$MODLIST_FILE"

              if [ -d "$pack_dir/mods" ]; then
                python3 .github/scripts/generate_modlist.py "$pack_dir" >> "$MODLIST_FILE"
              fi

              # 2. Copy metadata.json if present
              if [ -f "$pack_dir/metadata.json" ]; then
                cp "$pack_dir/metadata.json" "dist/packs/$PACK_ID/metadata.json"
              fi

              # 3. Build Manifest entry
              RELEASE_BASE="https://github.com/${{ github.repository }}/releases/latest/download"
              MANIFEST="${MANIFEST}{\"id\":\"${PACK_ID}\",\"mrpack\":\"${RELEASE_BASE}/${PACK_ID}.mrpack\",\"curseforge\":\"${RELEASE_BASE}/${PACK_ID}-curseforge.zip\",\"modlist\":\"packs/${PACK_ID}/modlist.txt\"},"
            fi
          done

          MANIFEST="${MANIFEST%,}]"
          echo "$MANIFEST" > dist/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
